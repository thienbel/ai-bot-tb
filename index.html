<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIENBEO AI Chat</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #08090b; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        @keyframes rainbowMove { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        .card-wrapper {
            padding: 3px; border-radius: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; animation: rainbowMove 3s linear infinite;
            width: 400px;
        }
        .card { background: #11141a; border-radius: 17px; padding: 20px; height: 550px; display: flex; flex-direction: column; }
        .title-neon {
            font-size: 18px; font-weight: 900; text-align: center; margin-bottom: 15px; text-transform: uppercase;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bf7, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rainbowMove 2.5s linear infinite;
        }
        .chat-box { flex: 1; background: #0a0c0f; border-radius: 10px; padding: 12px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 10px; max-width: 85%; font-size: 14px; word-break: break-word; line-height: 1.4; }
        .bot { background: #1a1e27; color: #00ffd5; align-self: flex-start; border-left: 3px solid #00ffd5; }
        .user { background: #0099ff; color: #fff; align-self: flex-end; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; background: #0a0c0f; border: 1px solid #383f47; border-radius: 8px; padding: 10px; color: #fff; outline: none; }
        input:focus { border-color: #00ffd5; }
        button { background: linear-gradient(135deg, #00ffcc, #0099ff); color: #000; border: none; padding: 10px 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="card-wrapper">
    <div class="card">
        <div class="title-neon">💬AI Chat Mini</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">Chào Thiên! Tôi là trợ lý AI của bạn. Hãy hỏi tôi bất cứ điều gì nhé! 🚀</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Nhập tin nhắn cho AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>
</div>

<script>
    // Dán API Key Gemini của bạn vào trong dấu ngoặc kép dưới đây
    const API_KEY = "AQ.Ab8RN6LB5Utk7NejhjFrKpyBANqTXUJBCruMh6vlzkLs-6McDw"; 

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();
        if(!text) return;

        // Hiển thị tin nhắn người dùng
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Hiển thị khung chờ phản hồi
        const loadingId = 'loading_' + Date.now();
        chatBox.innerHTML += `<div class="message bot" id="${loadingId}">AI đang suy nghĩ... 🤔</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // Sử dụng endpoint chuẩn v1 để tránh lỗi 404
            const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                const aiReply = data.candidates[0].content.parts[0].text;
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="message bot">${aiReply}</div>`;
            } else {
                throw new Error("Phản hồi từ API không hợp lệ");
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message bot" style="color: #ff4d4d;">❌ Lỗi kết nối AI API, hãy kiểm tra lại khóa API Key nhé!</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
</body>
</html>
